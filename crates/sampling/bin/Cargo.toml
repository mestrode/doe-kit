[package]
name = "doe-sampling"
description = "sampling: the Design of Experiments sampling command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/mestrode/doe-kit"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
plhs = { path = "../plhs" }
doe-stats = { path = "../../sensitivity/stats" }
doe-pool = { path = "../../doe-pool" }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "sampling"
path = "src/main.rs"
