[package]
name = "doe-stats"
description = "Statistical analysis of Design of Experiments pools: sampling points and evaluated results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/mestrode/doe-kit"

[dependencies]
plhs = { path = "../../sampling/plhs" }
doe-types = { path = "../../doe-types" }
serde = { version = "1", features = ["derive"] }

[lib]
name = "doe_stats"
path = "src/lib.rs"
