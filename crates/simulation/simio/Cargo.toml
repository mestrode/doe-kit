[package]
name = "doe-simio"
description = "simio: simulation input/output for the doe-kit design pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/mestrode/doe-kit"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
doe-types = { path = "../../doe-types" }
doe-pool = { path = "../../doe-pool" }

[[bin]]
name = "simio"
path = "src/main.rs"
